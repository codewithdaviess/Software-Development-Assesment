services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isimo_weather
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isimo_weather"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./isimo-backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build:
      context: ./isimo-backend
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@db:5432/isimo_weather
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./isimo-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pg_data:
